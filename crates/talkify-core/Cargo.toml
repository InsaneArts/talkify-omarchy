[package]
name = "talkify-core"
description = "The pure rules of Talkify for Omarchy: session machine, chord guard, levels, protocol, config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rphonetic = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
